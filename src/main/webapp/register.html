<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | ProjectFlow</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-page"><a class="brand auth-brand" href="index.html">ProjectFlow<span>.</span></a><main class="auth-shell"><div class="auth-intro"><div class="eyebrow">GET ORGANIZED</div><h1>Your next big thing<br>starts right here.</h1><p>Create an account and bring your projects into focus.</p></div><div class="auth-card"><h2>Create account</h2><p class="muted">It only takes a minute to get started.</p><div id="message" class="notice error" hidden></div><form action="register" method="post"><label for="name">Full name</label><input id="name" name="name" type="text" maxlength="100" placeholder="Your name" required><label for="email">Email address</label><input id="email" name="email" type="email" maxlength="150" placeholder="you@example.com" required><label for="password">Password</label><input id="password" name="password" type="password" minlength="8" placeholder="At least 8 characters" required><button class="btn full" type="submit">Create account →</button></form><p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p></div></main><script>const q=new URLSearchParams(location.search),m=document.getElementById('message');if(q.get('error')==='exists'){m.hidden=false;m.textContent='That email is already registered. Try logging in.'}else if(q.get('error')==='invalid'){m.hidden=false;m.textContent='Enter your name, email, and a password with at least 8 characters.'}</script></body></html>
