<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in | ProjectFlow</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-page"><a class="brand auth-brand" href="index.html">ProjectFlow<span>.</span></a><main class="auth-shell"><div class="auth-intro"><div class="eyebrow">WELCOME BACK</div><h1>Good work starts<br>with a clear plan.</h1><p>Log in to pick up where you left off.</p></div><div class="auth-card"><h2>Log in</h2><p class="muted">Enter your account details below.</p><div id="message" class="notice" hidden></div><form action="login" method="post"><label for="email">Email address</label><input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required><label for="password">Password</label><input id="password" name="password" type="password" placeholder="Your password" autocomplete="current-password" required><button class="btn full" type="submit">Log in →</button></form><p class="auth-switch">New to ProjectFlow? <a href="register.html">Create an account</a></p></div></main><script>const q=new URLSearchParams(location.search),m=document.getElementById('message');if(q.has('error')){m.hidden=false;m.textContent='Email or password was incorrect.'}else if(q.has('registered')){m.hidden=false;m.textContent='Account created! You can log in now.'}</script></body></html>
